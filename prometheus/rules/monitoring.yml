groups:
  - name: availability
    rules:
      - alert: ScrapeTargetDown
        expr: up{job=~"homer|loki|grafana|alertmanager|pbx-node|freeswitch"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
          description: "Prometheus has failed to scrape this target for more than 3 minutes."

      - alert: EndpointProbeFailed
        expr: probe_success == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Probe failed for {{ $labels.instance }}"
          description: "The {{ $labels.job }} probe has failed for more than 3 minutes."

      - alert: SyntheticSIPCallFailed
        expr: synthetic_sip_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Synthetic SIP check failed for {{ $labels.instance }}"
          description: "The scheduled SIPp scenario did not complete successfully."

      - alert: SyntheticSIPCallStale
        expr: time() - synthetic_sip_last_run_timestamp_seconds > 600
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Synthetic SIP check is stale for {{ $labels.instance }}"
          description: "No synthetic SIP result has been pushed for more than 10 minutes."

  - name: host-health
    rules:
      - alert: HostHighCPU
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU use on {{ $labels.instance }}"
          description: "CPU use has exceeded 90% for 10 minutes."

      - alert: HostCPUContention
        expr: 100 * avg by (instance) (rate(node_cpu_seconds_total{mode="steal"}[5m])) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU steal is high on {{ $labels.instance }}"
          description: "CPU steal has exceeded 5% for 10 minutes; investigate VPS host contention."

      - alert: HostLowMemory
        expr: 100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low available memory on {{ $labels.instance }}"
          description: "Less than 10% of memory is available."

      - alert: HostDiskFilling
        expr: 100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Filesystem is filling on {{ $labels.instance }}"
          description: "{{ $labels.mountpoint }} has less than 15% free space."

      - alert: HostDiskCritical
        expr: 100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 7
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Filesystem is critically full on {{ $labels.instance }}"
          description: "{{ $labels.mountpoint }} has less than 7% free space."

      - alert: HostDiskIOWait
        expr: 100 * avg by (instance) (rate(node_cpu_seconds_total{mode="iowait"}[5m])) > 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High I/O wait on {{ $labels.instance }}"
          description: "I/O wait has exceeded 15% for 10 minutes."
